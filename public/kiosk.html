<!doctype html>
<html lang="en" data-theme-key="qms.kiosk.theme">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b2545" />
  <title>Get a queue number</title>
  <link rel="icon" href="/img/favicon.ico" />
  <script src="/theme-init.js"></script>
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/kiosk.css" />
</head>
<body>
  <header class="top">
    <img src="/img/sti-logo-sm.png" alt="" width="52" height="37" />
    <div class="org"><b id="org-name">Queue</b><small>Get your queue number</small></div>
    <span class="net" id="net" role="status"><i aria-hidden="true"></i><span>Connecting…</span></span>
    <button id="theme" class="theme-btn" type="button"></button>
  </header>
  <div id="banner" class="banner" role="alert" hidden></div>
  <div id="notice" class="notice-bar" role="status" hidden></div>
  <main id="screen"><p class="loading">Loading…</p></main>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="overlay"></div>
  <noscript><p class="loading">This page needs JavaScript to take a queue number. Please ask staff for help.</p></noscript>
  <script type="module" src="/js/kiosk/main.js"></script>
</body>
</html>
